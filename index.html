<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>별하 v8.6 MINIMAL - 버튼 작동 보장</title>
<style>body{font-family:Pretendard,sans-serif;background:#fbf6ff;padding:20px}
.card{background:#fff;border-radius:20px;padding:18px;border:1px solid #f0e8ff;margin-bottom:14px}
.input{width:100%;padding:13px;border-radius:14px;border:1.5px solid #ece8ff}
.btn{width:100%;padding:16px;border-radius:14px;border:none;background:#00c853;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
</style></head><body>
<div class="card">
<h2>⭐ 별하 v8.6 MINIMAL ✅</h2>
<p style="font-size:12px;color:#888">버튼 작동 테스트용 초간단 버전</p>
<input class="input" id="name" value="김동규">
<input class="input" id="birth_date" type="date" value="1963-10-31" style="margin-top:10px">
<input class="input" id="birth_time" type="time" value="12:30" style="margin-top:10px">
<button class="btn" id="submitBtn" onclick="render()" style="margin-top:14px">✅ v8.6 결과 보기 - 무조건 작동! →</button>
</div>
<div id="outputView" style="display:none" class="card">
<h3 id="outTitle"></h3>
<p id="outBody" style="font-size:13px;line-height:1.7"></p>
<button onclick="location.reload()" style="margin-top:10px">← 다시</button>
</div>
<script>
function render(){
  try{
    alert('✅ v8.6 버튼 클릭 성공!');
    const name=document.getElementById('name').value||'김동규';
    const bd=document.getElementById('birth_date').value;
    const bt=document.getElementById('birth_time').value;
    console.log('render start',name,bd,bt);
    document.getElementById('outTitle').innerText=name+'님 사주 결과 (v8.6 minimal)';
    document.getElementById('outBody').innerHTML='입력: '+bd+' '+bt+'<br><br>🎉 버튼이 작동합니다! 이제 이 상태에서 원래 로직을 하나씩 복구하면 됩니다.<br><br>원본 v8.5 로직은 너무 커서 에러 위치를 찾기 어렵습니다. 이 minimal이 작동하면 v8.6에 원래 계산 로직을 안전하게 다시 넣겠습니다.';
    document.getElementById('outputView').style.display='block';
    window.scrollTo(0,0);
  }catch(e){
    alert('에러: '+e.message);
    console.error(e);
  }
}
document.getElementById('submitBtn').addEventListener('click', function(){ console.log('listener click'); render(); });
console.log('v8.6 loaded');
</script>
</body></html>
