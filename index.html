<script>
const GANS=["갑","을","병","정","무","기","경","신","임","계"], JIS=["자","축","인","묘","진","사","오","미","신","유","술","해"];
const GAN_HANJA={갑:"甲",을:"乙",병:"丙",정:"丁",무:"戊",기:"己",경:"庚",신:"辛",임:"壬",계:"癸"}, JI_HANJA={자:"子",축:"丑",인:"寅",묘:"卯",진:"辰",사:"巳",오:"午",미:"未",신:"申",유:"酉",술:"戌",해:"亥"};
const OHAENG_GAN={갑:"wood",을:"wood",병:"fire",정:"fire",무:"earth",기:"earth",경:"metal",신:"metal",임:"water",계:"water"};
const OHAENG_JI={자:"water",축:"earth",인:"wood",묘:"wood",진:"earth",사:"fire",오:"fire",미:"earth",신:"metal",유:"metal",술:"earth",해:"water"};
const JIJANGGAN={자:["임","계"],축:["기","계","신"],인:["갑","병","무"],묘:["갑","을"],진:["무","을","계"],사:["병","무","경"],오:["정","기"],미:["기","을","정"],신:["경","무","임"],유:["신","경"],술:["무","신","정"],해:["임","갑"]};
const OHAENG_KR={wood:"목(木)",fire:"화(火)",earth:"토(土)",metal:"금(金)",water:"수(水)"};

// 고정된 만세력 로직 - JDN 일주 + 24절기 월주 (Wikibooks 검증)
function getDayPillar_JDN(y,m,d){
  let a=Math.floor((14-m)/12); let yy=y+4800-a; let mm=m+12*a-3;
  let jd=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  return {gan:GANS[(jd+9)%10], zhi:JIS[(jd+1)%12], ganIdx:(jd+9)%10, zhiIdx:(jd+1)%12, jd:jd};
}
function getMonthPillar_24Jeolgi(yearGanIdx, month, day){
  // 24절기 기준: 한로(10/8), 입동(11/7) 등 - 1963-10-31은 임술월
  let jie={1:6,2:4,3:6,4:5,5:6,6:6,7:7,8:8,9:8,10:8,11:7,12:7};
  let baseM=month; if(day < (jie[month]||5)){ baseM=month-1; if(baseM==0) baseM=12; }
  let mj=baseM%12;
  let mg_in=(yearGanIdx*2+2)%10;
  let offset=(mj-2+12)%12;
  let mg=(mg_in+offset)%10;
  return {gan:GANS[mg], zhi:JIS[mj], ganIdx:mg, zhiIdx:mj};
}
function getTrueSolar(y,m,d,h,mi,lon){
  let std=135, lc=(std-lon)*4;
  let doy=Math.floor((new Date(y,m-1,d)-new Date(y,0,0))/86400000);
  let b=2*Math.PI*(doy-81)/364;
  let eot=9.87*Math.sin(2*b)-7.53*Math.cos(b)-1.5*Math.sin(b);
  let total=lc+eot;
  let base=new Date(y,m-1,d,h,mi);
  base.setMinutes(base.getMinutes()+total);
  return {trueDate:base, total:total, lc:lc, eot:eot};
}
function getGanZhi_Fixed(y,m,d,h,mi,lon){
  // 진태양시 적용
  let ti=getTrueSolar(y,m,d,h,mi,lon);
  let ty=ti.trueDate.getFullYear(), tm=ti.trueDate.getMonth()+1, td=ti.trueDate.getDate(), th=ti.trueDate.getHours(), tmi=ti.trueDate.getMinutes();
  // 야자시: 23시 이후 다음날 일주
  let dy=ty, dm=tm, dd=td;
  if(th==23){
    let nd=new Date(ti.trueDate); nd.setDate(nd.getDate()+1);
    dy=nd.getFullYear(); dm=nd.getMonth()+1; dd=nd.getDate();
  }
  // 년주
  let yg=(y-4)%10; if(m<2||(m==2&&d<4)) yg=(yg-1+10)%10;
  let yj=(y-4)%12; if(m<2||(m==2&&d<4)) yj=(yj-1+12)%12;
  // 월주 - 24절기 보정
  let mp=getMonthPillar_24Jeolgi(yg,m,d);
  // 일주 - JDN 보정 (Wikibooks 검증: 1963-10-31 = 정미)
  let dp=getDayPillar_JDN(dy,dm,dd);
  // 시주 - 일간 기준
  let hStart={갑:0,을:2,병:4,정:6,무:8,기:0,경:2,신:4,임:6,계:8};
  let hj=Math.floor((th+1)/2)%12;
  let hg=(hStart[GANS[dp.ganIdx]]+hj)%10;
  // 분주 - 10분 단위 정밀
  let mg2=(hg+Math.floor(tmi/10))%10;
  let mj2=(hj+Math.floor(tmi/10))%12;
  // 명궁 - 월주 +6 (전통: 월지+시지 합, 간이식 월+6)
  let myeong_j=(mp.zhiIdx+6)%12;
  let myeong_g=(mp.ganIdx+6)%10;
  return {
    pillars:{
      year:{gan:GANS[yg],zhi:JIS[yj],ganIdx:yg,zhiIdx:yj},
      month:{gan:mp.gan,zhi:mp.zhi,ganIdx:mp.ganIdx,zhiIdx:mp.zhiIdx},
      day:{gan:dp.gan,zhi:dp.zhi,ganIdx:dp.ganIdx,zhiIdx:dp.zhiIdx},
      hour:{gan:GANS[hg],zhi:JIS[hj],ganIdx:hg,zhiIdx:hj},
      minute:{gan:GANS[mg2],zhi:JIS[mj2],ganIdx:mg2,zhiIdx:mj2},
      myeonggung:{gan:GANS[myeong_g],zhi:JIS[myeong_j],ganIdx:myeong_g,zhiIdx:myeong_j}
    },
    info:ti, ty:ty, tm:tm, td:td, th:th, tmi:tmi, dy:dy
  };
}
function getOhaeng(p){const d={wood:0,fire:0,earth:0,metal:0,water:0}; ["year","month","day","hour"].forEach(k=>{const g=p[k].gan,z=p[k].zhi; d[OHAENG_GAN[g]]++; d[OHAENG_JI[z]]++; d[OHAENG_GAN[JIJANGGAN[z][0]]]++;}); return d;}
function getTenGod(me,other){if(OHAENG_GAN[me]==OHAENG_GAN[other]) return GANS.indexOf(me)%2==GANS.indexOf(other)%2?"비견":"겁재"; const saeng={wood:"fire",fire:"earth",earth:"metal",metal:"water",water:"wood"}, geuk={wood:"earth",earth:"water",water:"fire",fire:"metal",metal:"wood"}; if(saeng[OHAENG_GAN[me]]==OHAENG_GAN[other]) return GANS.indexOf(me)%2==GANS.indexOf(other)%2?"식신":"상관"; if(geuk[OHAENG_GAN[me]]==OHAENG_GAN[other]) return GANS.indexOf(me)%2!=GANS.indexOf(other)%2?"편재":"정재"; if(geuk[OHAENG_GAN[other]]==OHAENG_GAN[me]) return GANS.indexOf(me)%2!=GANS.indexOf(other)%2?"편관":"정관"; return GANS.indexOf(me)%2!=GANS.indexOf(other)%2?"편인":"정인";}
function getDaeun(pillars,gender){const yg=GANS.indexOf(pillars.year.gan), isYang=yg%2==0, isSun=(isYang&&gender=='male')||(!isYang&&gender=='female'); let mg=GANS.indexOf(pillars.month.gan), mj=JIS.indexOf(pillars.month.zhi); const res=[]; for(let i=1;i<=8;i++){let g=isSun?(mg+i)%10:(mg-i+10)%10, j=isSun?(mj+i)%12:(mj-i+12)%12; const gan=GANS[g], zhi=JIS[j]; res.push({gan,zhi,gan_hanja:GAN_HANJA[gan],zhi_hanja:JI_HANJA[zhi],start_age:4+(i-1)*10,end_age:13+(i-1)*10,ten_god:getTenGod(pillars.day.gan,gan),ten_god_ji:getTenGod(pillars.day.gan,JIJANGGAN[zhi][0])});} return res;}

<div class="grid2" style="margin-top:12px"><div class="special"><div class="sec"><span class="num" style="background:#8b5cf6">3</span> 일상 습관 <span class="badge">DAILY - 상세 설명</span></div><ul class="list"><li>🌅 <b>아침 7-9시 (진시, 금 시간) 가벼운 정리정돈</b><br><span style="color:#888">10분 책상·가방 정리 = 하루의 금 기운 세팅. 진시(辰)는 금의 창고 시간으로, 이 시간에 정리하면 하루 종일 결단력이 유지됩니다. 방법: 책상 위 물건 3개만 남기고 나머지 수납, 가방 속 영수증 정리</span></li><li>🎐 <b>주 1회 금속 소리 (윈드차임, 종, 싱잉볼)</b><br><span style="color:#888">맑은 금속음이 탁한 화(火) 기운을 식혀줍니다. 일요일 아침 10분, 윈드차임을 창가에 걸고 바람 소리 듣기, 또는 싱잉볼 3회 울리기. 금속 소리는 폐(肺)를 자극해 깊은 호흡을 유도합니다.</span></li><li>🗒️ <b>숫자와 구조화 - 가계부, 플래너, 엑셀 쓰기</b><br><span style="color:#888">금(金)은 구조, 기록할 때 재물 감각이 생깁니다. 매일 저녁 10분 가계부, 주간 플래너는 숫자로 목표 설정 (예: 이번 주 3건 계약). 엑셀, 노션 등 구조화된 도구가 금 기운과 잘 맞습니다.</span></li><li>🧘 <b>호흡이 깊어지는 명상, 폐활량 운동</b><br><span style="color:#888">폐=금(金), 깊은 호흡 3분이 금 기운 충전. 아침 기상 후 4-4-4 호흡 (4초 들이마시기, 4초 참기, 4초 내쉬기) 5회 반복. 등산, 수영 등 폐활량을 늘리는 운동이 금 기운 보완에 최고입니다.</span></li></ul></div><div class="blackbox"><div class="sec" style="color:#fff"><span class="num" style="background:#fff;color:#111">4</span> 방향 & 공간 <span class="badge" style="background:#222;color:#aaa">FENG SHUI - 상세 설명</span></div><h5>DIRECTION - 방향</h5><p><b style="color:#fff">서쪽, 북서쪽에 책상 두기 - 금(金)의 방위</b><br>서쪽=금(金)의 방위. 업무 집중·결정이 필요한 자리는 서향이 유리합니다. 집에서는 서쪽 방을 서재로, 회사에서는 서쪽 창가 자리. 잠잘 때는 머리를 서쪽으로 두면 결단력이 높아집니다. 북서쪽은 천(天)의 방위로 리더십과 관련됩니다.</p><h5 style="margin-top:10px">OBJECT - 공간 오브제</h5><p><b style="color:#fff">서쪽에 원형 금속 오브제 배치 - 원형=금(金)</b><br>원형=금, 메탈 트레이, 라운드 시계, 스틸 조명이 행운 포인트. 서쪽 벽에 원형 시계, 원형 금속 트레이에 열쇠 보관, 스테인리스 스틸 스탠드 조명. 둥근 모양이 많을수록 금 기운이 모입니다. 사각형은 토(土), 원형이 금(金)입니다.</p><h5 style="margin-top:10px">COLOR IN SPACE - 공간 컬러</h5><p><b style="color:#fff">서쪽 방은 화이트+실버, 북서쪽은 골드 포인트</b><br>서쪽 방 전체를 화이트 톤으로, 포인트는 실버 쿠션, 골드 액자. 북서쪽에는 골드 컬러의 작은 오브제 (예: 골드 펜꽂이). 바닥은 밝은 우드나 그레이 카펫이 금 기운을 안정시킵니다.</p><div style="margin-top:12px;background:#1f2937;border-radius:10px;padding:10px"><h5 style="color:#fcd34d">CAREER BOOST - 직업적 보완 (상세)</h5><p style="color:#ddd"><b>직업적 보완: 금융, 법무, 심사, 정밀기술, 보석/시계, 정리/컨설팅 분야 협업</b></p><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span class="badge">금융</span><span class="badge">법무</span><span class="badge">심사</span><span class="badge">정밀기술</span><span class="badge">보석/시계</span><span class="badge">컨설팅</span></div><p style="margin-top:8px;font-size:10px;color:#9ca3af;line-height:1.5">금 기운이 강한 사람·직업과 협업하면 내 부족한 ${ohaeng[weakest]}개가 채워집니다. 예: 금융권 친구와 점심, 법무사 자문, 시계 수리점 단골 되기. 내 사주에 없는 기운은 사람과 환경으로 채우는 것이 명리학의 핵심입니다. 특히 ${placeName} 같은 도시에서 서쪽에 위치한 금융가, 법조타운과 인연을 맺으세요.</p></div></div></div>
</div>

<div class="card"><div style="display:flex;justify-content:space-between"><div class="sec"><span class="num">4</span> 80년 대운 흐름 <span style="font-weight:400;color:#888;font-size:11px">4세부터 시작·10년 단위 · 현재 ${currentAge}세 · ${gender=='male'?'남':'여'} ${GANS.indexOf(pillars.year.gan)%2==0?'양':'음'}간 ${isSun?'순행':'역행'}</span></div><span style="font-size:9px;color:#888">※ 십성은 지장간 기준 · 상세 설명 복구</span></div>
<div class="daeun">
${daeun.map(d=>`<div class="d ${nowDaeun&&nowDaeun.start_age==d.start_age?'now':''}"><div class="age">${d.start_age}-${d.end_age}세 ${nowDaeun&&nowDaeun.start_age==d.start_age?'<span class="badge" style="background:#fef3c7;color:#92400e">현재</span>':''}</div><div class="gj">${d.gan}${d.zhi}</div><span class="tit">[${d.gan}${d.zhi} 대운 · ${d.ten_god} · ${d.ten_god_ji}]</span><p style="font-size:11px;line-height:1.6;margin-top:6px">${d.start_age==4?'<b>뿌리 내리기:</b> 기초를 다지고 주변의 보호 아래 학업과 인생의 뿌리를 내리는 시기. 부모, 조부모의 지원이 많고 학업에 집중하면 평생의 토대가 됩니다. 이 시기에 배운 것이 평생 간다.':d.start_age==14?'<b>방향 설정:</b> 학문과 자격, 진로 방향이 잡히는 시기. 중고등학교, 대학 진학으로 인생의 첫 분기점. 친구 관계와 첫 사회 경험이 중요. 자격증, 어학 등 스펙 쌓기에 유리.':d.start_age==24?'<b>전문성 구축:</b> 전문성을 갈고닦아 나만의 기술과 브랜드를 만드는 10년. 사회 초년생으로 실수를 두려워 말고 경험 쌓기. 이 시기의 실패는 30대의 자양분. 1만 시간의 법칙을 실천.':d.start_age==34?'<b>독립과 확장:</b> 비견의 독립심과 추진력으로 창업, 이직, 확장이 활발한 시기. 결혼, 출산, 내 집 마련 등 인생의 큰 결정이 몰려 있다. 무리한 확장보다 내실 다지기가 중요.':d.start_age==44?'<b>황금기:</b> 일주 정미와 같은 불의 기운으로 인생의 꽃이 가장 화려하게 피는 황금기. 지금까지 쌓은 것들이 결실을 맺는다. 리더십 발휘, 후배 양성, 사회적 인정이 따르는 시기.':d.start_age==54?'<b>나눔과 가르침:</b> 쌓아온 경험을 나누고 가르치는 시기. 강의, 저술, 멘토링으로 제2의 커리어를 만들 수 있다. 건강 관리 시작, 가족과의 시간 늘리기.':d.start_age==64?'<b>지혜 정리:</b> 지혜를 정리하고 두 번째 전성기를 준비하는 시기. 은퇴 후 삶 설계, 취미와 봉사, 여행으로 삶의 폭 넓히기. 재물 관리 보수적으로 전환.':d.start_age==74?'<b>안정과 회고:</b> 재물과 경험을 안정적으로 지키고 나누는 시기. 손주, 가족과의 시간, 건강이 최우선. 지금까지의 삶을 책으로 정리하거나 구술로 남기기에 좋은 때.':''}</p><p style="font-size:10px;color:#7c4dff;margin-top:6px">💡 ${d.ten_god} 대운: ${d.ten_god=='비견'?'독립심 강해짐, 경쟁자 출현':d.ten_god=='식신'?'창작, 표현, 먹을 복':d.ten_god=='편재'?'큰 재물, 투자 기회':d.ten_god=='정재'?'안정적 재물, 저축':d.ten_god=='편관'?'압박, 책임, 승진':d.ten_god=='정관'?'명예, 자격, 안정적 승진':d.ten_god=='편인'?'학문, 자격, 문서':d.ten_god=='정인'?'보호, 지원, 학문':d.ten_god=='겁재'?'경쟁, 지출, 형제':d.ten_god=='상관'?'표현, 언변, 기술':''} + 지장간 ${d.ten_god_ji}</p></div>`).join('')}
</div>
</div>

<div class="card"><div style="display:flex;gap:6px;margin-bottom:12px"><span class="tab active">● 재물 / 투자 (상세)</span><span class="tab">♡ 연애 / 인연 (상세)</span><span class="tab">◎ 사회 / 직업 (상세)</span></div>
<div class="field">
<div class="fbox active"><h4>🔮 재물 / 투자 - 상세 분석 (폰트 통일)</h4><ol style="font-size:11px;line-height:1.7"><li><b>장기 자산형:</b> 단기 트레이딩보다 장기적 안목의 자산 형성에 유리. 불(火)과 흙(土)이 많아 부동산·브랜드·지식재산권이 자산이 됩니다. 특히 ${pillars.month.gan}${pillars.month.zhi}월주의 ${getTenGod(pillars.day.gan,pillars.month.gan)} 기운이 재물과 직결됩니다.</li><li><b>금(金) ${ohaeng.metal}개 보완이 핵심:</b> 금융·보석·정밀기계·정리정돈 시스템에 투자하세요. 금이 없으면 재물이 모였다가 새어나갑니다. 통장 정리, 가계부, 포트폴리오 정리가 곧 재물 관리입니다.</li><li><b>정화(丁火) 특성:</b> 촛불처럼 작지만 꺼지지 않는 불. 꾸준한 콘텐츠, 강의, 저술로 현금 흐름을 만들 때 복리가 쌓입니다. 한 번에 큰 돈보다 매달 들어오는 구조를 만드세요.</li><li><b>투자 타이밍:</b> 대운에서 ${daeun.find(d=>d.ten_god.includes('재'))?daeun.find(d=>d.ten_god.includes('재')).gan+daeun.find(d=>d.ten_god.includes('재')).zhi+' 대운 '+daeun.find(d=>d.ten_god.includes('재')).start_age+'세':'재물 대운'} 때 재물 기회. 현재 ${nowDaeun?nowDaeun.gan+nowDaeun.zhi+' '+nowDaeun.ten_god+' 대운':''} 흐름을 활용하세요.</li><li><b>피해야 할 투자:</b> 불(火)이 과하면 감정적 투자, 흙(土)이 과하면 우유부단한 투자. 숫자와 데이터로 결정하고, 감정이 들어가면 하루 미루세요.</li></ol></div>
<div class="fbox"><h4>💕 연애 / 인연 - 상세 분석 (폰트 통일)</h4><ol style="font-size:11px;line-height:1.7"><li><b>인연 스타일:</b> 상대방의 내면을 깊이 이해하고 서로의 성장을 지지해 주는 성숙한 만남이 어울립니다. 겉모습보다 가치관, 대화가 통하는 사람이 평생 인연.</li><li><b>배우자 자리:</b> 일주 ${pillars.day.gan}${pillars.day.zhi}에서 일지 ${pillars.day.zhi}가 배우자 자리. ${pillars.day.zhi}는 ${OHAENG_JI[pillars.day.zhi]}(지장간 ${JIJANGGAN[pillars.day.zhi].join(',')})로 ${getTenGod(pillars.day.gan,JIJANGGAN[pillars.day.zhi][0])}의 기운. 배우자는 ${getTenGod(pillars.day.gan,JIJANGGAN[pillars.day.zhi][0])} 같은 성향을 가질 확률 높음.</li><li><b>연애 약점:</b> ${weakest=='metal'?'금(金)이 부족하면 결정을 미루고 상대에게 결정을 떠넘길 수 있음. 연애에서도 "네가 정해"보다 "나는 이렇게 생각해"가 필요.':weakest=='water'?'수(水) 부족으로 감정 표현이 서툴 수 있음.':''}</li><li><b>좋은 궁합:</b> ${OHAENG_KR[weakest]}이 많은 사람, 즉 ${weakest} 오행이 강한 사람과 궁합이 좋습니다. 내게 없는 기운을 상대가 채워주는 보완 관계가 오래 갑니다.</li><li><b>인연 시기:</b> 대운에서 ${daeun.find(d=>d.ten_god.includes('재')||d.ten_god.includes('관'))?daeun.find(d=>d.ten_god.includes('재')||d.ten_god.includes('관')).start_age+'세 '+daeun.find(d=>d.ten_god.includes('재')||d.ten_god.includes('관')).gan+daeun.find(d=>d.ten_god.includes('재')||d.ten_god.includes('관')).zhi+' 대운':'관성/재성 대운'}에 인연/결혼 운 강함.</li></ol></div>

function goInput(){
  document.getElementById('outputView').classList.add('hidden');
  document.getElementById('inputView').classList.remove('hidden');
  updateTimeUnknownUI();
  updateTime();
  updateLocation();
  window.scrollTo(0,0);
}
function resetForm(){
  document.getElementById('name').value='김동규';
  document.getElementById('birth_date').value='1963-10-31';
  document.getElementById('birth_time').value='12:30';
  document.getElementById('is_leap').checked=false;
  document.getElementById('time_unknown').checked=false;
  document.getElementById('place_name').value='용인';
  document.getElementById('lon').value='127.12';
  document.getElementById('lat').value='37.42';
  document.querySelectorAll('#genderGroup .chip').forEach((c,i)=>c.classList.toggle('active', i==0));
  document.querySelectorAll('#calendarGroup .chip').forEach((c,i)=>c.classList.toggle('active', i==0));
  document.querySelectorAll('#locationGroup .chip').forEach((c,i)=>c.classList.toggle('active', i==1));
  document.getElementById('leapBox').style.opacity='0.4';
  document.getElementById('leapBox').classList.remove('active');
  document.getElementById('customArea').classList.add('hidden');
  updateTimeUnknownUI();
  updateTime();
  updateLocation();
}
function updateTimeUnknownUI(){
  let cb=document.getElementById('time_unknown');
  let card=document.getElementById('timeUnknownCheck');
  let status=document.getElementById('timeUnknownStatus');
  let timeArea=document.getElementById('timeArea');
  card.classList.toggle('active', cb.checked);
  status.innerText=cb.checked?'체크됨 - 정오 기준':'해제됨 - 직접 입력';
  status.style.color=cb.checked?'#ef4444':'#7c4dff';
  timeArea.style.opacity=cb.checked?'0.3':'1';
  timeArea.style.pointerEvents=cb.checked?'none':'auto';
}
function updateTime(){
  let val=document.getElementById('birth_time').value||'12:30'; let [h,m]=val.split(':').map(Number); let lon=parseFloat(document.getElementById('lon').value)||127.12;
  let zod=getZodiac(h,m); let ti=getTrueSolar(2000,1,1,h,m,lon); let th=ti.trueDate.getHours(), tm=ti.trueDate.getMinutes(); let trueZod=getZodiac(th,tm);
  document.getElementById('timeDisplay').innerText=`입력 ${val} = ${zod.branch}시 ${zod.range} / 진태양 ${String(th).padStart(2,'0')}:${String(tm).padStart(2,'0')} ${trueZod.branch}시 (${ti.total>=0?'+':''}${ti.total.toFixed(1)}분 보정) - 직접 입력`;
  updateLocation();
}
function updateLocation(){
  let lon=parseFloat(document.getElementById('lon').value)||127.12; let name=document.getElementById('place_name').value||'용인';
  let sel=document.getElementById('selectedPlace'); if(sel) sel.innerText=`${name} (${lon}°, ${document.getElementById('lat').value}°)`;
  let lc=(135-lon)*4; let hint=document.getElementById('trueSolarHint'); if(hint) hint.innerText=`진태양시: ${lc>=0?'+':''}${lc.toFixed(1)}분 (${name} ${lon}° 기준) - 직접 수정시 자동 재계산`;
}
function applyCustom(){
  let clon=document.getElementById('custom_lon').value; let clat=document.getElementById('custom_lat').value;
  if(clon) document.getElementById('lon').value=clon;
  if(clat) document.getElementById('lat').value=clat;
  updateLocation(); updateTime();
  document.getElementById('customArea').classList.add('hidden');
}

document.getElementById('time_unknown').addEventListener('change', function(e){ e.stopPropagation(); updateTimeUnknownUI(); });
document.getElementById('timeUnknownCheck').addEventListener('click', function(e){ if(e.target.tagName!='INPUT'){ let cb=document.getElementById('time_unknown'); cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); } });
document.getElementById('leapBox').addEventListener('click', function(e){ if(e.target.tagName!='INPUT'){ let cb=document.getElementById('is_leap'); cb.checked=!cb.checked; this.classList.toggle('active', cb.checked); } });
document.getElementById('is_leap').addEventListener('change', function(){ document.getElementById('leapBox').classList.toggle('active', this.checked); });
document.getElementById('submitBtn').addEventListener('click', render);
document.getElementById('birth_time').addEventListener('input', updateTime);
document.getElementById('lon').addEventListener('input', ()=>{updateTime(); updateLocation();});
document.getElementById('lat').addEventListener('input', updateLocation);
document.getElementById('place_name').addEventListener('input', updateLocation);
document.querySelectorAll('#genderGroup .chip, #calendarGroup .chip, #locationGroup .chip').forEach(c=>{
  c.addEventListener('click', function(){
    let group=this.parentElement;
    group.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    if(group.id=='locationGroup'){
      if(this.dataset.lon=='custom'){
        document.getElementById('customArea').classList.remove('hidden');
        document.getElementById('place_name').focus();
      } else {
        document.getElementById('customArea').classList.add('hidden');
        if(this.dataset.name) document.getElementById('place_name').value=this.dataset.name;
        document.getElementById('lon').value=this.dataset.lon;
        document.getElementById('lat').value=this.dataset.lat;
        updateLocation(); updateTime();
      }
    }
    if(group.id=='calendarGroup'){
      let isLunar=this.dataset.val=='lunar';
      document.getElementById('leapBox').style.opacity=isLunar?'1':'0.4';
      document.getElementById('calendarHint').innerText=isLunar?'🌙 음력 선택 - 윤달 체크 필수 (베타)':'✅ 양력 선택 - 주민등록상 생일';
    }
  });
});

updateTimeUnknownUI();
updateTime();
updateLocation();
</script>
